name: Handoff data and code checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check data, frozen results and PMMS boundaries
        run: python3 scripts/verify_repository.py
